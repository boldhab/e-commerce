<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hab Commerce</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header-section">
      <nav class="nav-container">
        <div class="logo">
          <h1>Hab<span>Commerce</span></h1>
        </div>
        
        <div class="nav-actions">
          <div class="search-wrapper">
            <input
              type="text"
              placeholder="Search products..."
              class="search-input"
              id="search-input"
            />
            <button class="search-trigger">
              <img src="assets/search-logo.png" alt="Search" />
            </button>
          </div>
          
          <button class="cart-trigger" id="cart-btn">
            <div class="cart-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
              <span id="cart-count" class="cart-badge">0</span>
            </div>
          </button>

          <button class="menu-toggle" id="open">
            <span></span>
            <span></span>
          </button>
        </div>
      </nav>
    </header>

    <section class="hero-section">
      <div class="hero-content">
        <span class="hero-subtitle">New Collection 2026</span>
        <h2 class="hero-title">Experience Premium <span>Quality</span></h2>
        <p class="hero-description">Discover our curated selection of high-end products designed for the modern lifestyle.</p>
        <div class="hero-actions">
          <button class="btn btn-primary" onclick="document.getElementById('product-container').scrollIntoView({behavior: 'smooth'})">Shop Now</button>
          <button class="btn btn-outline">Learn More</button>
        </div>
      </div>
      <div class="hero-overlay"></div>
    </section>

    <section class="filter-bar">
      <div class="filter-container">
        <div class="categories" id="categories">
          <button class="cat-btn active" data-category="all">All</button>
          <button class="cat-btn" data-category="electronics">Electronics</button>
          <button class="cat-btn" data-category="fashion">Fashion</button>
          <button class="cat-btn" data-category="home">Home</button>
          <button class="cat-btn" data-category="sports">Sports</button>
        </div>
        
        <div class="sort-wrapper">
          <select id="sort-select" class="sort-select">
            <option value="default">Featured</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
          </select>
        </div>
      </div>
    </section>

    <main>
      <div class="product-container" id="product-container"></div>

      <div class="cart-sidebar" id="cart-sidebar">
        <div class="titless">
          <h2 class="title">Your cart</h2>
          <h2 class="closes" id="closes">close</h2>
        </div>
        <div class="cart-items" id="cart-items"></div>

        <h3>TOTAL: <span id="cart-total">0.00</span></h3>
        <button class="checkout-btn" id="checkoutBtn">Checkout</button>
      </div>
    </main>
    <!-- Payment Modal -->
    <div class="modal" id="paymentModal">
      <div class="modal-content">
        <span class="close" id="closePaymentModal">&times;</span>
        <form class="payment-form" id="paymentForm">
          <h2>Select Payment Method</h2>

          <div class="payment-option">
            <input
              type="radio"
              id="credit"
              name="payment"
              value="credit"
              required
            />
            <label for="credit">Credit Card</label>
          </div>

          <div class="payment-option">
            <input type="radio" id="crypto" name="payment" value="crypto" />
            <label for="crypto">Cryptocurrency</label>
          </div>

          <div class="payment-option">
            <input type="radio" id="paypal" name="payment" value="paypal" />
            <label for="paypal">PayPal</label>
          </div>

          <!-- Credit Card Fields -->
          <div class="form-section" id="credit-section">
            <div class="form-group">
              <label for="cc-number">Card Number</label>
              <input
                type="text"
                id="cc-number"
                name="cc-number"
                placeholder="1234 5678 9012 3456"
              />
            </div>
            <div class="form-group">
              <label for="cc-expiry">Expiry Date</label>
              <input
                type="text"
                id="cc-expiry"
                name="cc-expiry"
                placeholder="MM/YY"
              />
            </div>
            <div class="form-group">
              <label for="cc-cvv">CVV</label>
              <input
                type="number"
                id="cc-cvv"
                name="cc-cvv"
                placeholder="123"
              />
            </div>
          </div>

          <!-- Crypto Fields -->
          <div class="form-section" id="crypto-section">
            <div class="form-group">
              <label for="wallet">Wallet Address</label>
              <input
                type="text"
                id="wallet"
                name="wallet"
                placeholder="Enter your wallet address"
              />
            </div>
          </div>

          <!-- PayPal Fields -->
          <div class="form-section" id="paypal-section">
            <div class="form-group">
              <label for="paypal-email">PayPal Email</label>
              <input
                type="email"
                id="paypal-email"
                name="paypal-email"
                placeholder="you@example.com"
              />
            </div>
          </div>

          <button type="submit" class="submit-btn">Submit Payment</button>
        </form>
      </div>
    </div>

    <!-- Added to Cart Success Popup -->
    <div class="popup" id="addSuccessPopup">
      <div class="popup-content">
        <div class="success-icon">✓</div>
        <h3>Added to Cart!</h3>
        <p id="addedItemName" style="margin-bottom: 20px; color: var(--text-muted);"></p>
        <div class="popup-actions" style="display: flex; gap: 10px; justify-content: center;">
          <button class="btn btn-outline" onclick="closeAddPopup()">Continue</button>
          <button class="btn btn-primary" onclick="viewCart()">View Cart</button>
        </div>
      </div>
    </div>

    <!-- Success Popup -->
    <div class="popup" id="successPopup">
      <div class="popup-content">
        <h3>✅ Payment Submitted Successfully!</h3>
        <button class="close-btn" onclick="closePopup()">Close</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
